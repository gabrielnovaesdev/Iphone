<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">Órbita</title>
  <desc id="d">Vitrine da linha iPhone 17: iPhone 17 Pro, iPhone Air e iPhone 17.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .rise { opacity: 0; transform-box: fill-box; animation: rise 1.1s cubic-bezier(.22,1,.36,1) forwards; }
    .d1 { animation-delay: .15s } .d2 { animation-delay: .35s } .d3 { animation-delay: .55s }
    @keyframes rise { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }

    .orbit { transform-origin: 196px 186px; animation: spin 7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .ring { stroke-dasharray: 560; stroke-dashoffset: 560; animation: draw 1.6s cubic-bezier(.65,0,.35,1) .1s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }

    .model { opacity: 0; transform-box: fill-box; animation: cycle 9s cubic-bezier(.22,1,.36,1) infinite; }
    .m2 { animation-delay: 3s } .m3 { animation-delay: 6s }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(22px) }
      6%, 29% { opacity: 1; transform: none }
      35%, 100% { opacity: 0; transform: translateY(-22px) }
    }

    .dot { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .6s cubic-bezier(.34,1.56,.64,1) forwards; }
    @keyframes pop { from { opacity: 0; transform: scale(.2) } to { opacity: 1; transform: scale(1) } }

    @media (prefers-reduced-motion: reduce) {
      .rise, .dot, .model.m1 { opacity: 1; animation: none; }
      .ring { stroke-dashoffset: 0; animation: none; }
      .orbit, .model { animation: none; }
    }
  </style>

  <rect width="1280" height="420" rx="28" fill="#000"/>
  <rect x=".5" y=".5" width="1279" height="419" rx="27.5" fill="none" stroke="#1d1d1f"/>

  <!-- Logo: anel com um ponto em órbita -->
  <circle class="ring" cx="196" cy="186" r="88" fill="none" stroke="#f5f5f7" stroke-width="14"/>
  <g class="orbit"><circle cx="196" cy="98" r="11" fill="#d9692b"/></g>

  <text class="rise d1" x="340" y="200" font-size="104" font-weight="600" letter-spacing="-4" fill="#f5f5f7">Órbita</text>
  <text class="rise d2" x="344" y="252" font-size="28" fill="#86868b">Vitrine da linha iPhone 17, com animações reais dos aparelhos.</text>

  <!-- Cores reais dos acabamentos -->
  <g transform="translate(346 300)">
    <circle class="dot" style="animation-delay:.7s" cx="12" cy="12" r="12" fill="#d9692b"/>
    <circle class="dot" style="animation-delay:.8s" cx="46" cy="12" r="12" fill="#2f3a52"/>
    <circle class="dot" style="animation-delay:.9s" cx="80" cy="12" r="12" fill="#e3e4e5"/>
    <circle class="dot" style="animation-delay:1s" cx="114" cy="12" r="12" fill="#c8d8e6"/>
    <circle class="dot" style="animation-delay:1.1s" cx="148" cy="12" r="12" fill="#e8dcc4"/>
    <circle class="dot" style="animation-delay:1.2s" cx="182" cy="12" r="12" fill="#d9cbe8"/>
    <circle class="dot" style="animation-delay:1.3s" cx="216" cy="12" r="12" fill="#c6d1b5"/>
    <circle class="dot" style="animation-delay:1.4s" cx="250" cy="12" r="12" fill="#b6c8db"/>
  </g>

  <!-- Modelos alternando -->
  <g text-anchor="end">
    <text class="rise d3" x="1196" y="300" font-size="20" fill="#86868b">Agora na loja</text>
    <text class="model m1" x="1196" y="350" font-size="40" font-weight="600" letter-spacing="-1" fill="#f5f5f7">iPhone 17 Pro</text>
    <text class="model m2" x="1196" y="350" font-size="40" font-weight="600" letter-spacing="-1" fill="#f5f5f7">iPhone Air</text>
    <text class="model m3" x="1196" y="350" font-size="40" font-weight="600" letter-spacing="-1" fill="#f5f5f7">iPhone 17</text>
  </g>
</svg>
